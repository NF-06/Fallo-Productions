<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Favicon: "FP" in an italic serif on a dark rounded square.
       Change the pink by editing fill="#ff4fa3" below. -->
  <rect width="64" height="64" rx="14" fill="#09090b"/>
  <text x="32" y="45" text-anchor="middle"
        font-family="'Playfair Display', Didot, 'Bodoni MT', Georgia, 'Times New Roman', serif"
        font-style="italic" font-weight="700" font-size="36" letter-spacing="-2"
        fill="#ff4fa3">FP</text>
</svg>
